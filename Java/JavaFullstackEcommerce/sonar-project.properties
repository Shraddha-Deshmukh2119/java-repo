# -------------------------------------------------------------------------
# Global Project Identification
# -------------------------------------------------------------------------
sonar.projectKey=loosely-coupled-key_unified-system-analysis
sonar.projectName=Unified-Code-Coverage
sonar.sources=java-app/Java/JavaFullstackEcommerce/src,cpp-app

# -------------------------------------------------------------------------
# C++ Specific Analysis & Coverage Integration
# -------------------------------------------------------------------------
# 1. Tell SonarCloud where to find your compilation database (generated by CMake)
sonar.cfamily.compile-commands=cpp-app/build/compile_commands.json

# 2. Path to the XML coverage file generated by your C++ test pipeline (gcovr/cobertura)
sonar.cxx.coverage.reportPath=cpp-app/build/coverage.xml
# Or if you are using SonarCloud's native C-Family compiler wrapper:
sonar.cfamily.gcov.reportsPath=cpp-app/build/gcov-reports
